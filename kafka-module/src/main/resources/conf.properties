bootstrap.servers=bigdata1:9092,bigdata2:9092,bigdata3:9092
group.id=test009
# 支持多个时间段，用逗号分隔: 格式：yyyyMMddHHmm （不包含上限）
timeRange=202208260000-202208280000
# 有效数据定义。数据时间和kafka的时间戳（要kafka设置打开）相隔时间差(10分钟）
time.reduce.ms=600000

# 支持 rewrite,export,check，import
run.model=export

# 时间来源，取值:value,kafka-timestamp；value表示时间从数据中获得，kafka-timestamp取kafka的时间戳
time.origin=value

## 终端主题(URL) : terminalclick,impression,terminalerror
topics=impression
time.unit=ms
time.regexp=timestamp=(\\d{13})

## 前端主题 : adrequest,rtbflow,adflow,leftflow
#topics=
#time.unit=ms
#time.regexp="timestamp"\\s*:\\s*(\\d{13})

#  导入相关控制参数; 将csv数据放置到: export/${topic}
import.topic.batch.size=100
import.topic.batch.interval.ms=10